<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrap">
    <header class="game-header">
      <h1>2048</h1>
      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span id="best-score" class="score-value">0</span>
        </div>
      </div>
    </header>

    <div class="controls-row">
      <p class="instructions">방향키 또는 스와이프로 타일을 밀어 합치세요. 2048을 만들면 승리!</p>
      <button id="new-game-btn" class="new-game-btn" type="button">새 게임</button>
    </div>

    <div class="board-container" id="board-container">
      <div id="grid-background" class="grid-background"></div>
      <div id="tile-container" class="tile-container"></div>

      <div id="overlay" class="overlay" hidden>
        <p id="overlay-message" class="overlay-message"></p>
        <div class="overlay-buttons">
          <button id="keep-playing-btn" type="button" hidden>계속하기</button>
          <button id="restart-btn" type="button">새 게임</button>
        </div>
      </div>
    </div>

    <a class="back-link" href="../../../public/index.html">← 블로그로 돌아가기</a>
  </div>

  <script src="game.js"></script>
</body>
</html>
